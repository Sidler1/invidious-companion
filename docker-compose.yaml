services:
  invidious_companion:
    build:
      context: .
      dockerfile: Dockerfile
    # image: quay.io/invidious/invidious-companion:latest
    environment:
      # 16 alphanumeric characters; put it in .env (see .env.example) or export
      # it in the shell. Compose refuses to start without it.
      SERVER_SECRET_KEY: ${SERVER_SECRET_KEY:?set SERVER_SECRET_KEY (16 alphanumeric chars) in .env or the environment}
    ports:
      - 127.0.0.1:8282:8282
    restart: unless-stopped
    cap_drop:
      - ALL
    read_only: true
    user: 10001:10001
    volumes:
      # cache for youtube library
      - /var/tmp/youtubei.js:/var/tmp/youtubei.js:rw
      # TOML overrides. The file must exist before the first `docker compose up`
      # (a plain copy of the example is enough):
      #   cp config/config.example.toml config/config.toml
      # create_host_path: false makes compose fail with a clear error instead of
      # silently creating an empty directory when the file is missing.
      - type: bind
        source: ./config/config.toml
        target: /app/config/config.toml
        read_only: true
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
