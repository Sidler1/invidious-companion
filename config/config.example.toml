#####
# The configuration options listed below are able to be enabled as needed.
# The values in this example are the defaults. Some values can alternatively
# be set using an environment variable.
#
# In order to enable an option, make sure you uncomment both the option
# and the block header for the section it belongs to. Any other commented
# options will continue to use default values.
# See https://toml.io/en/ for details on the configuration format.
#####

# [server]
# port = 8282 # env variable: PORT
# host = "127.0.0.1" # env variable: HOST
# # Listens to a unix socket on instead of a TCP socket
# use_unix_socket = false # env variable: SERVER_USE_UNIX_SOCKET
# unix_socket_path = "/tmp/invidious-companion.sock" # env variable: SERVER_UNIX_SOCKET_PATH
# # Base path Invidious companion will serve from
# base_path = "/companion" # env variable: SERVER_BASE_PATH
# # secret key needs to be exactly 16 characters long
# secret_key = "CHANGEME12345678" # env variable: SERVER_SECRET_KEY
# verify_requests = false # env variable: SERVER_VERIFY_REQUESTS
# encrypt_query_params = false # env variable: SERVER_ENCRYPT_QUERY_PARAMS
# enable_metrics = false # env variable: SERVER_ENABLE_METRICS

# # Trust the first X-Forwarded-For hop as the client address (rate limiting).
# # Only enable behind a reverse proxy you control.
# trust_proxy = false # env variable: SERVER_TRUST_PROXY

# [server.rate_limit]
# # Inbound per-client-IP token bucket. Companion routes are reachable from
# # end-user browsers, so this stops a single client from burning the egress
# # IP's anti-bot budget. Exempt: /healthz, /readyz, /metrics.
# # Disabled by default. Only enable this when the companion actually sees
# # real per-user client IPs: either it is exposed directly to browsers, or
# # it sits behind a reverse proxy that forwards X-Forwarded-For together
# # with trust_proxy = true above. Behind Invidious's default same-origin
# # `/companion/*` proxy the companion sees only Invidious's own backend
# # IP (that proxy does not forward X-Forwarded-For), so enabling this
# # would rate-limit the whole instance instead of each user.
# enabled = false # env variable: SERVER_RATE_LIMIT_ENABLED
# requests_per_minute = 120 # env variable: SERVER_RATE_LIMIT_RPM
# burst = 60 # env variable: SERVER_RATE_LIMIT_BURST

# [cache]
# enabled = true # env variable: CACHE_ENABLED
# # will get cached in /var/tmp/youtubei.js if you specify /var/tmp
# # you need to change the --allow-write from deno run too
# directory = "/var/tmp" # env variable: CACHE_DIRECTORY
# # How long deciphered player responses are cached (seconds, max 21600 = 6h).
# ttl_seconds = 3600 # env variable: CACHE_TTL_SECONDS
# # Short-lived caching of non-OK responses (unavailable/unplayable videos) so a
# # client re-requesting a bad video doesn't re-hit YouTube every time. Kept
# # small so real recoveries are picked up quickly. 0 disables. (anti-block)
# negative_ttl_seconds = 30 # env variable: CACHE_NEGATIVE_TTL_SECONDS
 
# [networking]
## Proxy type supported: https://docs.deno.com/api/deno/~/Deno.Proxy
# #proxy = "" # env variable: PROXY
# # IPv6 rotation settings - allows sending requests with unique IPv6 addresses
# # This requires IPv6 setup: https://github.com/iv-org/invidious-companion/wiki/How-to-send-IPv6-requests-with-a-new-IPv6-address-for-each-request-on-a-server-with-a-whole-IPv6-range
# # Randomizes all bits after the block prefix (e.g., /32 randomizes bits 33-128)
# #ipv6_block = "2001:db8::/32" # env variable: NETWORKING_IPV6_BLOCK

###
# Proxy pool. By default FAILOVER ONLY (not load-balancing): one proxy is pinned
# as the active egress and all traffic flows through it; `rotation` only decides
# which proxy becomes active next after the current one is blacklisted (3
# failures, a detected block, or a failed health probe). This keeps a session
# egressing from one IP. Prefer residential/mobile proxies; datacenter IPs are
# blocked hard.
#
# switch_proxy_on_limit (default false) turns on rate-limit-aware spreading:
# when the active proxy's rate-limit gate is saturated, traffic hops to the next
# healthy proxy that still has capacity. Each proxy keeps its OWN session
# (visitor_data + PO token minted from that proxy's IP), swapped in lockstep
# with the active proxy, so the egress IP and its tokens stay consistent.
# Requires [networking.rate_limit] enabled.
###
# [networking.proxy_pool]
# enabled = false
# rotation = "round-robin" # or "random"
# health_check = true
# switch_proxy_on_limit = false # env variable: NETWORKING_PROXY_POOL_SWITCH_ON_LIMIT
# proxies = ["http://user:pass@host:port", "socks5://host:port"]

###
# Best-effort outbound rate limiting. Caps how hard a single egress IP is hit —
# a strong anti-block signal. ENABLED BY DEFAULT with conservative values. When
# the proxy pool is active each proxy is throttled independently. Raise
# min_interval_ms (e.g. 250-500) for stricter, more human-like pacing on one IP
# at the cost of throughput.
###
# [networking.rate_limit]
# enabled = true # env variable: NETWORKING_RATE_LIMIT_ENABLED
# max_concurrent = 8 # env variable: NETWORKING_RATE_LIMIT_MAX_CONCURRENT
# min_interval_ms = 0 # env variable: NETWORKING_RATE_LIMIT_MIN_INTERVAL_MS

# [networking.videoplayback]
# # Enable YouTube new video format UMP
# ump = false # env variable: NETWORKING_VIDEOPLAYBACK_UMP
 
###
# Network call timeouts when talking to YouTube. 
# Needed in order to ensure Deno closes hanging connections
###
# [networking.fetch]
# timeout_ms = 30000 # env variable: NETWORKING_FETCH_TIMEOUT_MS
 
###
# Network call retries when talking to YouTube, using
# https://docs.deno.com/examples/exponential_backoff/
###
# [networking.fetch.retry]
# # enable retries on calls to YouTube
# enabled = false # env variable: NETWORKING_FETCH_RETRY_ENABLED
# # max number of times to retry
# times = 1 # env variable: NETWORKING_FETCH_RETRY_TIMES
# # minimum wait after first call (ms)
# initial_debounce = 0 # env variable: NETWORKING_FETCH_RETRY_INITIAL_DEBOUNCE
# # how much to back off after each retry (multiplier of initial_debounce)
# debounce_multiplier = 0 # env variable: NETWORKING_FETCH_RETRY_DEBOUNCE_MULTIPLIER
 
# [captions]
# # Ability to disable captions in case you are getting blocked too
# # aggressively by YouTube (caption fetches consume PO tokens).
# # See https://github.com/iv-org/invidious-companion/pull/259
# enabled = true # env variable: CAPTIONS_ENABLED
 
# [jobs]
 
# [jobs.youtube_session]
# # whether to generate PO tokens
# po_token_enabled = true # env variable: JOBS_YOUTUBE_SESSION_PO_TOKEN_ENABLED
# # how often the cron CHECKS the session (cron format)
# frequency = "*/5 * * * *" # env variable: JOBS_YOUTUBE_SESSION_FREQUENCY
# # how long a generated session (visitor_data + integrity token) is kept before
# # a full re-attestation. 0 = regenerate on every cron tick (legacy behaviour).
# # A detected block forces an immediate regeneration regardless.
# session_lifetime_hours = 6 # env variable: JOBS_YOUTUBE_SESSION_LIFETIME_HOURS
# # Innertube client types tried, in order, when the primary WEB response is
# # bot-blocked or has no stream URLs. The first client returning adaptive-format
# # URLs wins, so order by quality. ANDROID_VR is last by default because it
# # degraded to 360p-only in some regions in early 2026. Retune as YouTube
# # changes which clients work. env var (comma-separated):
# # JOBS_YOUTUBE_SESSION_PLAYER_FALLBACK_CLIENTS
# player_fallback_clients = ["TV_SIMPLY", "MWEB", "ANDROID_VR"]

# [youtube_session]
# oauth_enabled = false # env variable: YOUTUBE_SESSION_OAUTH_ENABLED
# cookies = "" # env variable: YOUTUBE_SESSION_COOKIES
# # Locale/geo pinning. Leave empty for youtubei.js defaults. With geo-diverse
# # proxies, match these to the egress country (e.g. gl = "US", hl = "en").
# gl = "" # env variable: YOUTUBE_SESSION_GL
# hl = "" # env variable: YOUTUBE_SESSION_HL
# # Pin a specific YouTube player build. Useful for a few days after YouTube
# # ships a player that youtubei.js cannot decipher yet. Empty = latest.
# player_id = "" # env variable: YOUTUBE_SESSION_PLAYER_ID
