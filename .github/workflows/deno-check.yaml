name: Testing

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  static-checks:
    name: Format, type-check, lint
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Verify formatting
        run: deno task format

      - name: Verify typing
        run: deno task check

      - name: Run linter
        run: deno task lint

  unit-tests:
    name: Unit tests (no network)
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - name: Setup repo
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-

      # main_test.ts boots the real server and talks to YouTube; everything
      # else is deterministic and must fail fast without any proxy/retry loop.
      - name: Run unit tests
        run: deno task test --ignore=src/tests/main_test.ts

  integration-tests:
    name: Integration test (YouTube via proxy)
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - name: Setup repo
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Checkout binaries repo
        uses: actions/checkout@v6
        with:
          repository: iv-org/binaries
          path: ci-binaries

      - name: Install and run tor
        # Pinned to a commit SHA; `main` is a mutable ref.
        uses: tor-actions/setup-tor@64121bc84235ab7038224e8ce08601efdb9bd8d9 # main as of 2024-06-10
        with:
          daemon: true
          port: 9150
          config: |
            ExcludeExitNodes {us}
            StrictNodes 1

      - name: Run integration test with opera-proxy (fallback to tor)
        run: |
          OPERA_SUCCESS=false
          for attempt in {1..4}; do
            echo "=== Opera-proxy attempt $attempt/4 ==="
            ci-binaries/opera-proxy-amd64 &
            PROXY_PID=$!
            sleep 3s
            curl -s -x http://127.0.0.1:18080 --retry 5 --retry-delay 2 --retry-connrefused https://check.torproject.org/api/ip; echo
            rm -rf /var/tmp/youtubei.js
            if PROXY=http://127.0.0.1:18080 deno task test src/tests/main_test.ts; then
              OPERA_SUCCESS=true
              kill $PROXY_PID 2>/dev/null
              break
            fi
            kill $PROXY_PID 2>/dev/null
          done

          if [ "$OPERA_SUCCESS" = true ]; then
            echo "=== Integration test passed with opera-proxy ==="
            exit 0
          fi

          echo "=== Opera-proxy failed, falling back to tor ==="
          for attempt in {1..12}; do
            echo "=== Tor attempt $attempt/12 ==="
            sudo pkill -HUP tor
            curl -s --socks5 127.0.0.1:9150 https://check.torproject.org/api/ip; echo
            rm -rf /var/tmp/youtubei.js
            if PROXY=socks5://127.0.0.1:9150 deno task test src/tests/main_test.ts; then
              echo "=== Integration test passed with tor ==="
              exit 0
            fi
          done

          echo "=== All attempts failed ==="
          exit 1

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      # persist-credentials: false -- the Dockerfile bind-mounts .git into the
      # builder stage (for `git log`/`git rev-list` version metadata); the
      # default checkout would otherwise write the workflow token into
      # .git/config where the build could read it.
      - name: Setup repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build only (no registry push): catches a broken Dockerfile or a
      # compile failure inside the builder stage before it reaches master.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: false
          platforms: linux/amd64
          build-args: |
            CHECK_CHECKSUMS=1
          cache-from: type=gha
          # ignore-error: true -- fork PRs can't write to the cache scope;
          # without it, the cache-to step warns/fails noisily on every fork PR.
          cache-to: type=gha,mode=max,ignore-error=true
